name: Luau Tests

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    name: Run FEM Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Lune
        uses: lune-org/setup-lune@v2
        with:
          version: "0.11.1"

      - name: Run FEM tests
        run: lune run tests/run.luau
